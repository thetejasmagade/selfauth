[project]
name = "selfauth-playground-flask"
version = "0.0.0"
description = "Reference implementation of SelfAuth for Flask (Python); the source of generated Flask projects."
requires-python = ">=3.11"
dependencies = [
  "flask>=3.1,<4",
  "argon2-cffi>=23.1",
  "psycopg[binary]>=3.2",
  "PyMySQL[rsa]>=1.1",
  "pymongo>=4.9",
  "waitress>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
