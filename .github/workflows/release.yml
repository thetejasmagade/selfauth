name: Release

# On every push to main, changesets/action either opens (or updates) a
# "Release: version packages" PR from the pending .changeset/*.md files, or,
# once that PR is merged, publishes the new versions to npm with provenance.
# Nothing is published until a maintainer merges the release PR.
# Publishes with npm trusted publishing (OIDC): no npm token is stored. Each package
# needs this repository + release.yml registered as its trusted publisher.
# Setup (once): docs/releasing.md.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing + provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    if: github.repository == 'thetejasmagade/selfauth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      - run: npm install -g npm@^11.5.1 && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action@v2
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "Release: version packages"
          commit: "Release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
