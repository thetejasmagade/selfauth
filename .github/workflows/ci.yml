name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      # Real database for the Prisma store, migration tests and the conformance suite.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: selfauth
          POSTGRES_PASSWORD: selfauth
          POSTGRES_DB: selfauth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selfauth -d selfauth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://selfauth:selfauth@localhost:5432/selfauth_test
      # Fail instead of skipping if the database is not configured.
      SELFAUTH_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Specification coverage report
        run: pnpm --filter @selfauth/conformance coverage:report

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium for Playwright
        run: pnpm --filter @selfauth/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e

  generated-project:
    name: Generated project (${{ matrix.database }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { database: memory, mode: none }
          - { database: postgresql, mode: none }
          - { database: memory, mode: vue }
          - { database: postgresql, mode: react }
          - { database: memory, mode: add }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: selfauth
          POSTGRES_PASSWORD: selfauth
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selfauth -d smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMOKE_DATABASE_URL: postgresql://selfauth:selfauth@localhost:5432/smoke
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate, install, migrate, boot and exercise a project outside the monorepo
        run: scripts/smoke-generated.sh ${{ matrix.database }} ${{ matrix.mode }}
