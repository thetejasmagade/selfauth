name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation-only pull requests skip the expensive jobs below (skipped jobs count as passed).
  # Anything outside docs/, .changeset/ and root Markdown files counts as code.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ] || git diff --name-only "$BASE...$HEAD" | grep -qvE '^(docs/|\.changeset/|[^/]+\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      # Pull requests test the primary Node version; main also covers the newest one.
      matrix:
        node: ${{ fromJSON(github.event_name == 'push' && '[22, 24]' || '[22]') }}
    services:
      # Real database for the Prisma store, migration tests and the conformance suite.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: selfauth
          POSTGRES_PASSWORD: selfauth
          POSTGRES_DB: selfauth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selfauth -d selfauth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://selfauth:selfauth@localhost:5432/selfauth_test
      # Fail instead of skipping if the database is not configured.
      SELFAUTH_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Manual templates match what the CLI generates
        run: pnpm templates:check
      - name: Specification coverage report
        run: pnpm --filter @selfauth/conformance coverage:report
      - name: Dependency audit
        if: matrix.node == 22
        run: pnpm audit --prod --audit-level high

  e2e:
    name: Browser end-to-end tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm build --cache-dir=.turbo
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @selfauth/e2e exec playwright --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium for Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @selfauth/e2e exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @selfauth/e2e exec playwright install-deps chromium
      - run: pnpm e2e

  packages:
    name: Published packages (pack, install, run)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm build --cache-dir=.turbo
      - name: Pack every published package and install the tarballs outside the monorepo
        run: scripts/pack-check.sh "$RUNNER_TEMP/packed"
      - name: Generate and exercise projects with the packaged CLI (bundled templates and skill)
        env:
          SELFAUTH_SMOKE_CLI: ${{ runner.temp }}/packed/node_modules/@selfauth/cli/dist/bin.js
        run: |
          scripts/smoke-generated.sh memory none
          SMOKE_BACKEND=fastify scripts/smoke-generated.sh memory none
          scripts/smoke-generated.sh memory add
          scripts/smoke-generated.sh memory add-layout
          SMOKE_BACKEND=fastify scripts/smoke-generated.sh memory add-layout

  docs:
    name: Documentation site (check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare the documentation with the CLI, configuration schema, routes and error codes
        run: pnpm docs:check
      - name: Build (fails on a dead internal link)
        run: pnpm docs:build

  derived-databases:
    name: Conformance on derived databases (${{ matrix.database }}, ${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, mongodb]
        app: [playground, playground-fastify]
    env:
      MYSQL_TEST_URL: mysql://root:root@127.0.0.1:3306/selfauth_test
      MONGODB_TEST_URL: mongodb://127.0.0.1:27017/selfauth_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm build --cache-dir=.turbo
      - name: Start MySQL (installed on the runner image, off by default)
        if: matrix.database == 'mysql'
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS selfauth_test"
      - name: Start MongoDB
        if: matrix.database == 'mongodb'
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" 2>/dev/null | grep -q 1 && exit 0
            sleep 2
          done
          docker logs mongo
          exit 1
      - name: Run every conformance case against the database
        run: node scripts/dialect-conformance.mjs ${{ matrix.database }} ${{ matrix.app }}

  gin:
    name: Gin (Go) reference app
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    services:
      # Real database for the pgx store, the migrator and the conformance suite.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: selfauth
          POSTGRES_PASSWORD: selfauth
          POSTGRES_DB: selfauth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selfauth -d selfauth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://selfauth:selfauth@localhost:5432/selfauth_test
      SELFAUTH_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/playground-gin/go.mod
          cache-dependency-path: apps/playground-gin/go.sum
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm build --cache-dir=.turbo
      - name: Format, vet and unit tests
        working-directory: apps/playground-gin
        run: |
          test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
          go vet ./...
          go test -race ./...
      - name: Run every conformance case against the Go application
        run: pnpm --filter @selfauth/playground-gin conformance

  generated-gin-project:
    name: Generated Gin project (${{ matrix.database }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [memory, postgresql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: selfauth
          POSTGRES_PASSWORD: selfauth
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selfauth -d smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMOKE_DATABASE_URL: postgresql://selfauth:selfauth@localhost:5432/smoke
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/playground-gin/go.mod
          cache-dependency-path: apps/playground-gin/go.sum
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm build --cache-dir=.turbo
      - name: Generate a Gin project outside the monorepo and exercise it
        run: scripts/smoke-gin.sh ${{ matrix.database }}

  generated-project:
    name: Generated project (${{ matrix.backend || 'express' }}, ${{ matrix.database }}, ${{ matrix.mode }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { database: memory, mode: none }
          - { database: postgresql, mode: none }
          # SQLite (derived from the PostgreSQL reference): API only, and full-stack on Fastify.
          - { database: sqlite, mode: none }
          - { backend: fastify, database: sqlite, mode: react }
          # MySQL (derived from the PostgreSQL reference), against a real MySQL 8.
          - { database: mysql, mode: none }
          - { backend: fastify, database: mysql, mode: vue }
          # MongoDB (its own Mongoose store), against a real MongoDB 7.
          - { database: mongodb, mode: none }
          - { backend: fastify, database: mongodb, mode: vue }
          - { database: memory, mode: vue }
          - { database: postgresql, mode: react }
          - { database: memory, mode: add }
          - { database: memory, mode: add-layout }
          # Fastify (`init --backend fastify`): API only, and full-stack with a real database.
          - { backend: fastify, database: memory, mode: none }
          - { backend: fastify, database: postgresql, mode: vue }
          # `selfauth add` into an existing Fastify app (examples/existing-fastify-app).
          - { backend: fastify, database: memory, mode: add }
          # No SelfAuth tooling at all: templates/express copied by hand, plain npm + Prisma.
          - { database: postgresql, mode: manual }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: selfauth
          POSTGRES_PASSWORD: selfauth
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selfauth -d smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMOKE_DATABASE_URL: postgresql://selfauth:selfauth@localhost:5432/smoke
      SMOKE_MYSQL_URL: mysql://root:root@127.0.0.1:3306/smoke
      SMOKE_MONGODB_URL: mongodb://127.0.0.1:27017/smoke
      SMOKE_BACKEND: ${{ matrix.backend || 'express' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm build --cache-dir=.turbo
      - name: Start MySQL (installed on the runner image, off by default)
        if: matrix.database == 'mysql'
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS smoke CHARACTER SET utf8mb4 COLLATE utf8mb4_bin"
      - name: Start MongoDB
        if: matrix.database == 'mongodb'
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" 2>/dev/null | grep -q 1 && exit 0
            sleep 2
          done
          docker logs mongo
          exit 1
      - name: Generate, install, migrate, boot and exercise a project outside the monorepo
        run: scripts/smoke-generated.sh ${{ matrix.database }} ${{ matrix.mode }}
