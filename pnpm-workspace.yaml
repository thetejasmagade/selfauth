packages:
  - "packages/*"
  - "conformance"
  - "apps/*"
  - "skills"
  - "website"

# Packages allowed to run install scripts (pnpm blocks all others by default).
# Prisma downloads its schema engine for migrations.
onlyBuiltDependencies:
  - "@prisma/engines"
  - better-sqlite3
  - prisma

# Advisories accepted on purpose. Review and remove each once a patched release exists.
auditConfig:
  ignoreGhsas:
    # picomatch ReDoS (high), reached only via apps/playground-vue > vue-router (build-time globbing).
    # No patched version was published when this was added (2026-11-18).
    - GHSA-fc5q-39xc-vjpf
    # effect ReDoS in Schema.TemplateLiteral (high), reached only via the Prisma CLI's config loader
    # (prisma > @prisma/config > effect), which runs at build time on developer and CI machines and
    # never in a running server. Forcing effect >= 3.22.1 breaks `prisma generate` (Prisma's loader
    # needs the version it pins), and no Prisma release depends on a patched effect yet (checked
    # 2026-11-21). Remove once one does.
    - GHSA-7589-6fvf-x4pw
